name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Tests & Coverage
        run: npm run coverage

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo FS Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  docker-build-and-scan:
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Downcase Repository Name for Docker Tagging
        run: |
          echo "IMAGE_REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV

      # Build Frontend Image (Tagged with latest and commit SHA)
      - name: Build Frontend Image
        run: |
          docker build \
            -t ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest \
            -t ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ env.COMMIT_SHA }} \
            -f docker/Dockerfile.frontend .

      # Scan Frontend Image with Trivy
      - name: Run Trivy Scanner (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # Build Backend Image (Tagged with latest and commit SHA)
      - name: Build Backend Image
        run: |
          docker build \
            -t ghcr.io/${{ env.IMAGE_REPO }}/backend:latest \
            -t ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ env.COMMIT_SHA }} \
            -f docker/Dockerfile.backend .

      # Scan Backend Image with Trivy
      - name: Run Trivy Scanner (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ env.IMAGE_REPO }}/backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # Test Docker Compose Orchestration (Integration/E2E check)
      - name: Verify Docker Compose Orchestration
        run: |
          docker compose up -d
          echo "Waiting 15 seconds for services to boot and connect..."
          sleep 15
          docker compose ps
          # Query backend health via frontend Nginx proxy on Port 80
          curl -s --fail http://localhost/api/health || (docker compose logs && exit 1)
          docker compose down

      # Log in to GitHub Container Registry (Only on push to main)
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push Frontend & Backend Images to GHCR (Only on push to main)
      - name: Publish Images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
          docker push ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ env.COMMIT_SHA }}
          docker push ghcr.io/${{ env.IMAGE_REPO }}/backend:latest
          docker push ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ env.COMMIT_SHA }}
