# Unique key for the SonarQube project (must be unique within the SonarQube instance)
sonar.projectKey=aio-soc-platform

# Display name of the project in SonarQube UI
sonar.projectName=aio-soc-platform

# Project version
sonar.projectVersion=1.0.0

# Paths to the source directories containing main application code (comma-separated)
sonar.sources=frontend,backend

# Paths to directories containing tests (comma-separated)
sonar.tests=tests

# File exclusions pattern to ignore during scanning
sonar.exclusions=node_modules/**,dist/**,coverage/**,tests/**,*.config.js

# Path to the test coverage report (Vitest LCOV format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source code encoding
sonar.sourceEncoding=UTF-8
